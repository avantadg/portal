<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hidden-content { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div id="login-screen" class="w-full max-w-sm mt-20 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <div class="mb-8 text-center">
            <h2 class="text-2xl font-bold text-white">Acceso Exclusivo</h2>
            <p class="text-slate-400 text-sm mt-2">Introduce la contraseña de miembro</p>
        </div>
        <input type="password" id="password-input" placeholder="Tu contraseña" class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl mb-4 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
        <button onclick="verificar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/20">Ingresar</button>
        <p id="error-msg" class="text-red-400 text-sm mt-4 text-center hidden">Contraseña incorrecta, intenta de nuevo.</p>
    </div>

    <main id="main-content" class="hidden-content max-w-3xl w-full py-12 px-4">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-extrabold text-white mb-3">Biblioteca Digital</h1>
            <p class="text-slate-400">Recursos premium disponibles para miembros.</p>
        </header>
        <div id="links-container" class="grid grid-cols-1 gap-4"></div>
    </main>

    <script>
        const CLAVE_FIJA = "Mbrsportalavantak84";

        function verificar() {
            const input = document.getElementById('password-input').value;
            if (input === CLAVE_FIJA) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden-content');
                renderizarContenido();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('password-input').value = '';
            }
        }

        function renderizarContenido() {
            const links = [
                { title: "PACK GALLETAS NEW YORK", icon: "🍪", url: "https://drive.google.com/drive/folders/1tgTBd_Rdq3Inu4XiynBXdaMw5zffDICC?usp=drive_link" },
                { title: "PACK VERSICULOS DE LA BIBLIA", icon: "📖", url: "https://docs.google.com/document/d/1fG3vr5QbOwuYc9LkG_UU8NMJ7InmgnFp3QiytGVa0M8/edit?usp=drive_link" },
                { title: "IMÁGENES Y VIDEOS", icon: "📸", url: "https://drive.google.com/drive/folders/10W3fBp_9U2qhODfEOtpg47Agf5rBOC5p?usp=drive_link" },
                { title: "+ 1000 EBOOK", icon: "📚", url: "https://drive.google.com/drive/folders/1I1EkzoVckSIeciptRC4xwZgrXVDImJWK?usp=drive_link" },
                { title: "CERTIFICADO PLR", icon: "📜", url: "https://www.canva.com/design/DAHEapCMoCU/TG8q9R601WKxcanRHGF-3A/view?utm_content=DAHEapCMoCU&utm_campaign=designshare&utm_medium=link&utm_source=viewer" },
                { title: "UNETE AL GRUPO DE WHATSAPP", icon: "💬", url: "https://chat.whatsapp.com/LJbSxVjM5uEIQFhYoLme4y?s=cl&p=a&mlu=0" }
            ];

            const container = document.getElementById('links-container');
            container.innerHTML = links.map(link => `
                <a href="${link.url}" target="_blank" class="group flex items-center justify-between bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-6 rounded-2xl transition-all duration-300 shadow-lg shadow-black/20">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">${link.icon}</span>
                        <span class="font-bold text-slate-200 group-hover:text-emerald-400 transition-colors">${link.title}</span>
                    </div>
                    <div class="bg-slate-800 p-2 rounded-lg group-hover:bg-emerald-500 transition-colors">
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </div>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
